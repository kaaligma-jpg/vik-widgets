<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vik — Insurance Pipeline</title>
<style>
  :root{
    --ink:#152238;
    --ink-2:#1F3352;
    --paper:#F6F4EF;
    --paper-2:#FFFFFF;
    --brass:#A9762F;
    --brass-2:#C69350;
    --slate:#5B6472;
    --line:#E2DED4;
    --good:#3C6E47;
    --warn:#B4762E;
    --danger:#A23B34;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  .app{ display:flex; min-height:100vh; }
  .sidebar{ width:220px; background:var(--ink); color:#EDE8DD; padding:28px 20px; flex-shrink:0; }
  @media (max-width: 820px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; }
    .sidebar .navlist{ display:none; }
  }
  .brand{ font-family:var(--serif); font-size:22px; letter-spacing:0.2px; color:#fff; }
  .brand small{ display:block; font-family:var(--sans); font-size:11px; color:var(--brass-2); margin-top:4px; font-weight:600; }
  .navlist{ margin-top:36px; display:flex; flex-direction:column; gap:4px; }
  .navlist a{ all:unset; cursor:pointer; padding:10px 12px; border-radius:6px; font-size:14px; color:#C9D0DC; display:block; }
  .navlist a.active{ background:rgba(255,255,255,0.08); color:#fff; }
  .navlist a:hover{ background:rgba(255,255,255,0.06); }

  .main{ flex:1; padding:32px 36px 80px; max-width:1180px; }
  @media (max-width: 640px){ .main{ padding:20px 16px 60px; } }

  h1{ font-family:var(--serif); font-size:28px; margin:0 0 4px; font-weight:600; }
  .sub{ color:var(--slate); font-size:14px; margin:0 0 28px; }

  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:28px; }
  .stat{ background:var(--paper-2); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .stat .num{ font-family:var(--serif); font-size:26px; color:var(--ink); }
  .stat .lbl{ font-size:12px; color:var(--slate); margin-top:2px; }

  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  input, select, textarea{ font-family:var(--sans); font-size:14px; border:1px solid var(--line); background:var(--paper-2); border-radius:6px; padding:9px 11px; color:var(--ink); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brass-2); outline-offset:1px; }
  #search{ flex:1; min-width:180px; }
  .btn{ all:unset; cursor:pointer; font-size:14px; font-weight:600; padding:9px 16px; border-radius:6px; background:var(--ink); color:#fff; }
  .btn:hover{ background:var(--ink-2); }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn.ghost:hover{ background:#FBFAF6; }
  .btn.small{ padding:6px 12px; font-size:12px; }

  .card{ background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .card .top{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .card .name{ font-family:var(--serif); font-size:18px; font-weight:600; }
  .card .meta{ font-size:12px; color:var(--slate); margin-top:2px; }
  .badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge.insurance{ background:#DCE6EE; color:#2E5B7C; }
  .badge.investment{ background:#F0E1C8; color:var(--warn); }
  .badge.both{ background:#E4DCF5; color:#5B3E9E; }
  .badge.neo{ background:#F5DEDB; color:var(--danger); }
  .badge.nikki{ background:#DCE9DC; color:var(--good); }

  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
  @media (max-width:700px){ .grid3{ grid-template-columns:1fr; } }
  .field label{ display:block; font-size:11px; color:var(--slate); margin-bottom:4px; font-weight:600; }
  .field select, .field input{ width:100%; }

  .notes{ margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
  .notes .n{ font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .notes .n:last-child{ border-bottom:none; }
  .notes .n .ts{ font-size:11px; color:var(--slate); margin-left:6px; }
  .addnote{ display:flex; gap:8px; margin-top:8px; }
  .addnote textarea{ flex:1; min-height:36px; resize:vertical; }

  .empty{ text-align:center; padding:60px 20px; color:var(--slate); }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">FinCop <small>INSURANCE PIPELINE</small></div>
    <div class="navlist">
      <a class="active">Pipeline</a>
      <a href="vik-mortgage-dashboard.html">Mortgage Pipeline</a>
      <a title="Coming soon — recruit tracker">Recruits (soon)</a>
    </div>
  </div>

  <div class="main">
    <h1>Insurance &amp; Investment Pipeline</h1>
    <p class="sub">Leads from Nikki directly, plus cross-referrals from Neo when a mortgage client has no insurance or no retirement plan.</p>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input id="search" placeholder="Search by name, phone, email...">
      <select id="filterCategory"><option value="">All categories</option><option>Insurance</option><option>Investment</option><option>Both</option></select>
      <select id="filterInsurance"><option value="">Insurance: any</option></select>
      <select id="filterRetirement"><option value="">Retirement: any</option></select>
      <select id="filterAgeBand"><option value="">Age band: any</option></select>
      <button class="btn" id="addBtn">+ Add lead</button>
    </div>

    <div id="list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ENDPOINT = 'https://fincop-backend.onrender.com/app-data/insurance-clients';
const STATUS_OPTIONS = ["No","Yes — Sufficient","Yes — Insufficient"];
const AGE_BANDS = ["Under 40","40-45","46-50","51-55","56-60","61-65","65+"];
const STAGE_OPTIONS = ["Lead","Contacted","FNA Sent","FNA Completed","Application","Approved","Declined","Not Interested"];

let clients = [];

function ageBandFor(age){
  if(age===null || age===undefined || age==='') return '';
  const a = Number(age);
  if(isNaN(a)) return '';
  if(a<40) return 'Under 40';
  if(a<=45) return '40-45';
  if(a<=50) return '46-50';
  if(a<=55) return '51-55';
  if(a<=60) return '56-60';
  if(a<=65) return '61-65';
  return '65+';
}

async function loadClients(){
  try{
    const res = await fetch(ENDPOINT);
    const data = await res.json();
    clients = data && data.value ? JSON.parse(data.value) : [];
    clients.forEach(c=>{ if(!Array.isArray(c.notesList)) c.notesList = []; });
  }catch(e){ clients = []; }
  render();
}

async function saveClients(){
  try{
    await fetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ value: JSON.stringify(clients) }) });
  }catch(e){ showToast('Could not save — try again'); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function populateFilters(){
  const insSel = document.getElementById('filterInsurance');
  const retSel = document.getElementById('filterRetirement');
  STATUS_OPTIONS.forEach(s=>{
    insSel.appendChild(new Option(s,s));
    retSel.appendChild(new Option(s,s));
  });
  const ageSel = document.getElementById('filterAgeBand');
  AGE_BANDS.forEach(b=> ageSel.appendChild(new Option(b,b)));
}

function renderStats(){
  const total = clients.length;
  const insuranceGaps = clients.filter(c=> !c.insuranceStatus || c.insuranceStatus==='No' || c.insuranceStatus==='Yes — Insufficient').length;
  const retirementGaps = clients.filter(c=> !c.retirementStatus || c.retirementStatus==='No' || c.retirementStatus==='Yes — Insufficient').length;
  const crossReferred = clients.filter(c=> (c.sourceAgent||'').indexOf('Neo') !== -1).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Total leads</div></div>
    <div class="stat"><div class="num">${insuranceGaps}</div><div class="lbl">Insurance gaps</div></div>
    <div class="stat"><div class="num">${retirementGaps}</div><div class="lbl">Retirement gaps</div></div>
    <div class="stat"><div class="num">${crossReferred}</div><div class="lbl">Cross-referred from Neo</div></div>
  `;
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function matchesFilters(c){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const cat = document.getElementById('filterCategory').value;
  const ins = document.getElementById('filterInsurance').value;
  const ret = document.getElementById('filterRetirement').value;
  const band = document.getElementById('filterAgeBand').value;
  if(q){
    const hay = `${c.name||''} ${c.phone||''} ${c.email||''}`.toLowerCase();
    if(hay.indexOf(q)===-1) return false;
  }
  if(cat && c.leadCategory !== cat) return false;
  if(ins && (c.insuranceStatus||'') !== ins) return false;
  if(ret && (c.retirementStatus||'') !== ret) return false;
  if(band && (c.ageBand || ageBandFor(c.age)) !== band) return false;
  return true;
}

function render(){
  renderStats();
  const list = document.getElementById('list');
  const filtered = clients.filter(matchesFilters).sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
  if(!filtered.length){
    list.innerHTML = `<div class="empty">No leads match right now.</div>`;
    return;
  }
  list.innerHTML = filtered.map(c=>{
    const band = c.ageBand || ageBandFor(c.age) || '—';
    const sourceBadge = (c.sourceAgent||'').indexOf('Neo') !== -1
      ? `<span class="badge neo">Cross-ref from Neo</span>`
      : `<span class="badge nikki">Nikki</span>`;
    const catBadge = c.leadCategory==='Both' ? 'both' : (c.leadCategory==='Investment' ? 'investment' : 'insurance');
    return `
    <div class="card" data-id="${c.id}">
      <div class="top">
        <div>
          <div class="name">${escapeHtml(c.name)||'—'} ${c.dealCode?`<span style="font-size:12px;color:var(--slate);font-weight:400;">(${c.dealCode})</span>`:''}</div>
          <div class="meta">${escapeHtml(c.phone)||'—'} · ${escapeHtml(c.email)||'—'} · Age band: ${band}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <span class="badge ${catBadge}">${c.leadCategory||'Insurance'}</span>
          ${sourceBadge}
        </div>
      </div>

      <div class="grid3">
        <div class="field">
          <label>Stage</label>
          <select data-field="stage">${STAGE_OPTIONS.map(s=>`<option ${c.stage===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Insurance status</label>
          <select data-field="insuranceStatus"><option value="">—</option>${STATUS_OPTIONS.map(s=>`<option ${c.insuranceStatus===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Retirement plan status</label>
          <select data-field="retirementStatus"><option value="">—</option>${STATUS_OPTIONS.map(s=>`<option ${c.retirementStatus===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
      </div>

      ${c.linkedMortgageDealCode ? `<div class="meta" style="margin-top:8px;">Linked mortgage deal: ${escapeHtml(c.linkedMortgageDealCode)}</div>` : ''}
      ${c.sourceNotes ? `<div class="meta" style="margin-top:6px;">${escapeHtml(c.sourceNotes)}</div>` : ''}

      <div class="notes">
        ${(c.notesList||[]).slice().reverse().map(n=>`<div class="n">${escapeHtml(n.text)}<span class="ts">${new Date(n.ts).toLocaleString()} — ${escapeHtml(n.author||'Vik')}</span></div>`).join('') || '<div class="n" style="color:var(--slate);">No notes yet.</div>'}
        <div class="addnote">
          <textarea placeholder="Add a note..." data-note-input></textarea>
          <button class="btn small" data-add-note>Add</button>
        </div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.card').forEach(card=>{
    const id = card.getAttribute('data-id');
    const client = clients.find(c=>c.id===id);
    card.querySelectorAll('select[data-field]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        client[sel.getAttribute('data-field')] = sel.value;
        saveClients();
        renderStats();
      });
    });
    const addBtn = card.querySelector('[data-add-note]');
    addBtn.addEventListener('click', ()=>{
      const ta = card.querySelector('[data-note-input]');
      const val = ta.value.trim();
      if(!val) return;
      client.notesList = client.notesList || [];
      client.notesList.push({ text: val, ts: Date.now(), author: 'Vik' });
      saveClients();
      render();
    });
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filterCategory').addEventListener('change', render);
document.getElementById('filterInsurance').addEventListener('change', render);
document.getElementById('filterRetirement').addEventListener('change', render);
document.getElementById('filterAgeBand').addEventListener('change', render);

document.getElementById('addBtn').addEventListener('click', ()=>{
  const name = prompt('Client name?');
  if(!name) return;
  const dealCode = 'VikI' + String(clients.length + 1).padStart(4,'0');
  clients.push({
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    createdAt: Date.now(), dealCode, notesList: [],
    name, phone:'', email:'', age:null, ageBand:'',
    leadCategory:'Insurance', stage:'Lead',
    insuranceStatus:'', retirementStatus:'',
    sourceAgent:'Vik (manual)', sourceNotes:'', linkedMortgageDealCode:''
  });
  saveClients();
  render();
  showToast('Lead added');
});

populateFilters();
loadClients();
</script>
</body>
</html>
