<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My 90 Days — Team Vik</title>
<style>
  :root{
    --ink:#152238; --ink-2:#1F3352; --paper:#F6F4EF; --paper-2:#FFFFFF;
    --brass:#A9762F; --slate:#5B6472; --line:#E2DED4;
    --good:#3C6E47; --danger:#A23B34;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; }
  .topbar{ background:var(--ink); color:#fff; padding:14px 18px; font-family:var(--serif); font-size:18px; }
  .wrap{ max-width:640px; margin:0 auto; padding:18px 16px 60px; }
  .card{ background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  h1{ font-family:var(--serif); font-size:24px; margin:0 0 4px; font-weight:600; }
  .sub{ color:var(--slate); font-size:14px; margin-bottom:14px; }
  .daynum{ font-family:var(--serif); font-size:30px; color:var(--brass); margin:0; }
  .task{ white-space:pre-wrap; font-size:16px; margin:10px 0 0; }
  label{ display:block; font-size:13px; color:var(--slate); margin:12px 0 5px; }
  input, textarea, select{
    width:100%; font-family:var(--sans); font-size:16px; padding:11px 12px;
    border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
  }
  textarea{ min-height:96px; resize:vertical; }
  .btn{
    display:inline-block; font-family:var(--sans); font-size:15px; font-weight:500;
    padding:12px 18px; border-radius:7px; border:1px solid var(--ink);
    background:var(--ink); color:#fff; cursor:pointer;
  }
  .btn:active{ background:var(--ink-2); }
  .btn.secondary{ background:#fff; color:var(--ink); }
  .btn.wide{ width:100%; }
  .row2{ display:flex; gap:10px; }
  .row2 > *{ flex:1; }
  .pick{ display:flex; gap:10px; margin-top:14px; }
  .pick button{
    flex:1; padding:14px 8px; font-size:15px; border-radius:7px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink); font-family:var(--sans);
  }
  .pick button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .hist{ border-top:1px solid var(--line); padding:12px 0; font-size:14px; }
  .hist:first-child{ border-top:0; }
  .hist .hd{ font-weight:600; margin-bottom:3px; }
  .tag{ font-size:12px; padding:2px 8px; border-radius:20px; margin-left:6px; }
  .tag.g{ background:#E7F0E9; color:var(--good); }
  .tag.r{ background:#F6E7E6; color:var(--danger); }
  .muted{ color:var(--slate); font-size:13px; }
  .msg{ margin-top:12px; font-size:14px; }
  .msg.ok{ color:var(--good); }
  .msg.bad{ color:var(--danger); }
  .hide{ display:none; }
</style>
</head>
<body>
<div class="topbar">Team Vik</div>
<div class="wrap">

  <div id="gate" class="card">
    <h1>Sign in</h1>
    <div class="sub">Enter the code Vik sent you.</div>
    <label>Your code</label>
    <input id="codeInput" autocapitalize="off" autocorrect="off" placeholder="e.g. k7m2q9">
    <div style="margin-top:14px;"><button class="btn wide" onclick="signIn()">Open my day</button></div>
    <div id="gateMsg" class="msg"></div>
  </div>

  <div id="main" class="hide">

    <div class="card">
      <h1 id="hello">Hello</h1>
      <div class="sub" id="progress"></div>
      <p class="daynum" id="dayNum"></p>
      <div class="task" id="taskText"></div>
    </div>

    <div class="card" id="replyCard">
      <h1>Today's answer</h1>
      <div class="sub">Tell Vik how it went. He reads every one.</div>
      <div class="pick">
        <button id="btnDone" onclick="pickOutcome('done')">Done</button>
        <button id="btnNot" onclick="pickOutcome('not_done')">Not yet</button>
      </div>
      <label>What happened? (optional)</label>
      <textarea id="replyText" placeholder="What you did, what got in the way, or a question for Vik."></textarea>
      <div style="margin-top:14px;"><button class="btn wide" onclick="sendReply()">Send to Vik</button></div>
      <div id="replyMsg" class="msg"></div>
    </div>

    <div class="card">
      <h1>Top 100 list</h1>
      <div class="sub" id="prospCount"></div>
      <div class="row2">
        <div><label>First name</label><input id="pFirst"></div>
        <div><label>Last name</label><input id="pLast"></div>
      </div>
      <div class="row2">
        <div><label>Email</label><input id="pEmail"></div>
        <div><label>Phone</label><input id="pPhone"></div>
      </div>
      <label>Type</label>
      <select id="pType"><option>Referral Source</option><option>Client</option></select>
      <div style="margin-top:14px;"><button class="btn wide secondary" onclick="addProspect()">Add to my list</button></div>
      <div id="prospMsg" class="msg"></div>
    </div>

    <div class="card">
      <h1>Last 7 days</h1>
      <div id="histList"></div>
    </div>

  </div>
</div>

<script>
const API = 'https://fincop-backend.onrender.com';
const params = new URLSearchParams(location.search);
const RID = params.get('r') || '';
const SIDE = (params.get('s') === 'insurance') ? 'insurance' : 'mortgage';
let CODE = '';
let DAY = 0;
let outcome = '';

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function say(id, text, good){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (good ? 'ok' : 'bad');
}

async function signIn(){
  const code = document.getElementById('codeInput').value.trim();
  if(!RID){ say('gateMsg','This link is incomplete. Ask Vik to send it again.', false); return; }
  if(!code){ say('gateMsg','Enter your code.', false); return; }
  say('gateMsg','Checking…', true);
  try{
    const url = API + '/recruit-portal?s=' + encodeURIComponent(SIDE)
      + '&r=' + encodeURIComponent(RID) + '&code=' + encodeURIComponent(code);
    const res = await fetch(url);
    if(res.status === 403){ say('gateMsg','That code did not work. Check it and try again.', false); return; }
    if(!res.ok){ say('gateMsg','Could not connect. Try again in a minute.', false); return; }
    const d = await res.json();
    CODE = code;
    try{ localStorage.setItem('recruitCode_' + RID, code); }catch(e){}
    document.getElementById('gate').classList.add('hide');
    document.getElementById('main').classList.remove('hide');
    paint(d);
  }catch(e){
    say('gateMsg','Could not connect. Try again in a minute.', false);
  }
}

function paint(d){
  DAY = d.day || 0;
  document.getElementById('hello').textContent = 'Hello ' + (d.firstName || '');
  document.getElementById('progress').textContent =
    (DAY ? (d.done + ' of ' + DAY + ' days marked done') : 'Your program has not started yet.');
  document.getElementById('dayNum').textContent = DAY ? ('Day ' + DAY + ' of 90') : '';
  document.getElementById('taskText').textContent =
    d.task || (DAY ? 'No task loaded for today. Tell Vik.' : 'Vik will start you shortly.');
  document.getElementById('prospCount').textContent = (d.prospectCount || 0) + ' of 100 added';
  document.getElementById('replyText').value = d.todayText || '';
  outcome = d.outcome || '';
  markButtons();
  document.getElementById('replyCard').style.display = DAY ? '' : 'none';

  const h = d.history || [];
  document.getElementById('histList').innerHTML = h.length ? h.map(x => {
    const tag = x.outcome === 'done' ? '<span class="tag g">done</span>'
              : x.outcome ? '<span class="tag r">not yet</span>' : '';
    const note = x.text ? '<div class="muted">' + esc(x.text) + '</div>' : '';
    return '<div class="hist"><div class="hd">Day ' + x.day + tag + '</div>'
      + '<div class="muted">' + esc((x.task || '').slice(0, 160)) + '</div>' + note + '</div>';
  }).join('') : '<div class="muted">Nothing yet.</div>';
}

function markButtons(){
  document.getElementById('btnDone').className = (outcome === 'done') ? 'on' : '';
  document.getElementById('btnNot').className = (outcome === 'not_done') ? 'on' : '';
}
function pickOutcome(v){ outcome = v; markButtons(); }

async function sendReply(){
  if(!DAY){ return; }
  if(!outcome){ say('replyMsg','Tap Done or Not yet first.', false); return; }
  say('replyMsg','Sending…', true);
  try{
    const res = await fetch(API + '/recruit-reply', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ s:SIDE, r:RID, code:CODE, day:DAY,
        outcome: outcome, text: document.getElementById('replyText').value })
    });
    if(!res.ok){ say('replyMsg','Did not go through. Try again.', false); return; }
    say('replyMsg','Sent. Vik can see it now.', true);
    refresh();
  }catch(e){ say('replyMsg','Did not go through. Try again.', false); }
}

async function addProspect(){
  const first = document.getElementById('pFirst').value.trim();
  if(!first){ say('prospMsg','First name is needed.', false); return; }
  say('prospMsg','Adding…', true);
  try{
    const res = await fetch(API + '/recruit-prospect', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ s:SIDE, r:RID, code:CODE, firstName:first,
        lastName: document.getElementById('pLast').value,
        email: document.getElementById('pEmail').value,
        phone: document.getElementById('pPhone').value,
        type: document.getElementById('pType').value })
    });
    const d = await res.json();
    if(!res.ok){ say('prospMsg', d.error || 'Could not add. Try again.', false); return; }
    ['pFirst','pLast','pEmail','pPhone'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('prospCount').textContent = (d.count || 0) + ' of 100 added';
    say('prospMsg','Added.', true);
  }catch(e){ say('prospMsg','Could not add. Try again.', false); }
}

async function refresh(){
  try{
    const url = API + '/recruit-portal?s=' + encodeURIComponent(SIDE)
      + '&r=' + encodeURIComponent(RID) + '&code=' + encodeURIComponent(CODE);
    const res = await fetch(url);
    if(res.ok) paint(await res.json());
  }catch(e){}
}

(function(){
  let saved = '';
  try{ saved = localStorage.getItem('recruitCode_' + RID) || ''; }catch(e){}
  if(saved){ document.getElementById('codeInput').value = saved; signIn(); }
})();
</script>
</body>
</html>
