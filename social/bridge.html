<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>bridge</title></head>
<body style="margin:0;background:#0b1d45;color:#ffd98a;font:12px monospace;padding:6px">
<div id="log">bridge</div>
<script>
(async () => {
  const log = (m) => { document.getElementById('log').textContent += ' | ' + m; };
  const names = decodeURIComponent(location.hash.slice(1)).split(',').map(s => s.trim()).filter(Boolean);
  const files = [];
  for (const n of names) {
    try {
      const r = await fetch(n + '?v=' + Date.now());
      const b = await r.blob();
      files.push(new File([b], n.split('/').pop(), { type: b.type }));
    } catch (e) { log('fail ' + n + ' ' + e.message); }
  }
  log('files ' + files.length);
  let acked = false;
  window.addEventListener('message', (ev) => { if (ev.data && ev.data.type === 'vik-assets-ack') { acked = true; log('ack'); } });
  for (let i = 0; i < 90 && !acked; i++) {
    try { window.parent.postMessage({ type: 'vik-assets', files }, '*'); } catch (e) { log('post ' + e.message); }
    await new Promise(r => setTimeout(r, 1000));
  }
})();
</script>
</body></html>
